<div id="ski-first-look" lang="ko" data-screen="shop" aria-label="스키샵 매장과 차량 화면 시안">

    <div class="ski-brand"><span class="ski-brandmark"><i data-lucide="mountain-snow" aria-hidden="true"></i></span><div><strong>우리 스키샵</strong><span>매장과 차량을 한눈에</span></div></div>

</div>
<style>
#ski-first-look{--ski-accent:#0665ef;--ski-radius:18px;--ski-base:20px;--ski-ink:#182230;--ski-muted:#5f6b7b;--ski-line:#e0e5ed;--ski-bg:#f4f6fa;--ski-white:#fff;--ski-blue-soft:#edf4ff;--ski-orange:#a54d08;--ski-orange-soft:#fff2e4;--ski-green:#197451;--ski-green-soft:#e9f6ef;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:var(--ski-base);line-height:1.45;color:var(--ski-ink);background:var(--ski-bg);color-scheme:light;border:1px solid var(--ski-line);border-radius:22px;overflow:clip;position:relative;isolation:isolate}
#ski-first-look *{box-sizing:border-box}
#ski-first-look h1,#ski-first-look h2,#ski-first-look h3,#ski-first-look p{margin:0}
#ski-first-look button,#ski-first-look input,#ski-first-look select{font:inherit}
#ski-first-look button{cursor:pointer;-webkit-tap-highlight-color:transparent}

#ski-first-look button:focus-visible,#ski-first-look input:focus-visible,#ski-first-look select:focus-visible{outline:3px solid #83b5ff;outline-offset:3px}
#ski-first-look button{transition:background .15s,border-color .15s}
#ski-first-look [hidden]{display:none!important}
#ski-first-look svg{width:22px;height:22px;flex-shrink:0;stroke-width:1.8}
#ski-first-look .ski-header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--ski-white);padding:20px 24px;border-bottom:1px solid var(--ski-line)}
#ski-first-look .ski-brand{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#ski-first-look .ski-brandmark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--ski-accent);color:white}
#ski-first-look .ski-brandmark svg{width:29px;height:29px}
#ski-first-look .ski-brand strong{display:block;font-size:21px;letter-spacing:-.7px}
#ski-first-look .ski-brand span:not(.ski-brandmark){display:block;font-size:13px;color:var(--ski-muted);margin-top:2px}
#ski-first-look .ski-view-switch{display:flex;gap:4px;padding:4px;border-radius:14px;background:#f0f3f7}
#ski-first-look .ski-view-switch button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--ski-muted);border-radius:11px;padding:12px 18px;font-size:17px;font-weight:600;min-height:48px}
#ski-first-look .ski-view-switch button[aria-pressed=true]{background:var(--ski-white);color:var(--ski-accent);box-shadow:0 2px 5px #1721320a}
#ski-first-look .ski-demo{font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--ski-muted);padding:5px 9px;border:1px solid var(--ski-line);border-radius:6px;white-space:nowrap}
#ski-first-look .ski-content{padding:24px}
#ski-first-look .ski-pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
#ski-first-look .ski-eyebrow{color:var(--ski-muted);font-size:14px;display:block;margin-bottom:4px}
#ski-first-look h1{font-size:28px;font-weight:750;letter-spacing:-1.1px}
#ski-first-look h2{font-size:22px;font-weight:700;letter-spacing:-.6px}
#ski-first-look h3{font-size:19px;font-weight:650;letter-spacing:-.4px}
#ski-first-look .ski-secondary{color:var(--ski-muted);font-size:15px}
#ski-first-look .ski-link-button{display:flex;align-items:center;gap:8px;padding:12px 15px;min-height:50px;border:1px solid var(--ski-line);border-radius:12px;background:white;color:var(--ski-ink);font-size:16px;font-weight:600}
#ski-first-look .ski-grid-shop{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:22px;align-items:start}
#ski-first-look .ski-sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
#ski-first-look .ski-days{padding:18px;background:var(--ski-white);border:1px solid var(--ski-line);border-radius:var(--ski-radius);margin-bottom:18px}

#ski-first-look .ski-product-price{font-size:15px;color:var(--ski-muted);margin-bottom:13px;font-variant-numeric:tabular-nums}

#ski-first-look .ski-stepper output{font-size:24px;font-weight:700;min-width:29px;text-align:center;font-variant-numeric:tabular-nums}
#ski-first-look .ski-summary{background:white;border:1px solid var(--ski-line);border-radius:var(--ski-radius);overflow:clip}

#ski-first-look .ski-field input,#ski-first-look .ski-field select{display:block;width:100%;min-width:0;border:1px solid var(--ski-line);border-radius:11px;background:white;color:var(--ski-ink);padding:12px;margin-top:6px;font-size:18px;min-height:50px}

#ski-first-look .ski-receipt-row small{grid-column:1/-1;color:var(--ski-muted);font-size:14px}
#ski-first-look .ski-receipt-row strong{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
#ski-first-look .ski-actual{display:flex;gap:8px;align-items:start;padding:12px;background:#f2f7ff;color:#285793;border-radius:10px;font-size:14px;margin-top:16px}
#ski-first-look .ski-actual svg{width:17px;height:17px;margin-top:1px}
#ski-first-look .ski-discount{display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:16px;margin-bottom:16px}
#ski-first-look .ski-discount label{display:flex;align-items:center;gap:7px;min-width:0;color:var(--ski-muted)}
#ski-first-look .ski-discount input{width:110px;min-width:60px;text-align:right;font-size:18px;border:1px solid var(--ski-line);border-radius:9px;padding:9px;color:var(--ski-ink);min-height:46px}
#ski-first-look .ski-total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}
#ski-first-look .ski-total strong{font-size:31px;color:var(--ski-accent);letter-spacing:-.7px;font-variant-numeric:tabular-nums}
#ski-first-look .ski-primary,#ski-first-look .ski-secondary-button{display:flex;justify-content:center;align-items:center;gap:9px;min-height:60px;padding:13px 18px;border-radius:12px;font-size:19px;font-weight:650;border:1px solid var(--ski-accent);background:var(--ski-accent);color:white;width:100%}
#ski-first-look .ski-secondary-button{background:white;color:var(--ski-ink);border-color:var(--ski-line)}
#ski-first-look .ski-button-stack{display:grid;gap:10px}

#ski-first-look .ski-done-strip button{margin-left:auto;border:0;background:transparent;color:var(--ski-green);font-size:16px;font-weight:650;min-height:44px}

#ski-first-look .ski-vehicle-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
#ski-first-look .ski-filter{display:flex;gap:7px;flex-wrap:wrap}
#ski-first-look .ski-filter button{background:white;color:var(--ski-muted);border:1px solid var(--ski-line);border-radius:11px;padding:11px 15px;font-size:16px;min-height:46px;font-weight:600}
#ski-first-look .ski-filter button[aria-pressed=true]{background:#1e2c42;border-color:#1e2c42;color:white}
#ski-first-look .ski-sort{border:1px solid var(--ski-line);border-radius:10px;min-height:46px;padding:9px 12px;background:white;color:var(--ski-ink);font-size:16px;max-width:100%}
#ski-first-look .ski-vehicle-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
#ski-first-look .ski-vehicle-grid.is-simple{grid-template-columns:minmax(0,1fr)}
#ski-first-look .ski-job-list{display:grid;gap:11px}
#ski-first-look .ski-job-item{width:100%;text-align:left;border:1px solid var(--ski-line);background:white;border-radius:15px;padding:16px;color:var(--ski-ink);min-height:128px}
#ski-first-look .ski-job-item.is-selected{border-color:var(--ski-accent);box-shadow:inset 0 0 0 1px var(--ski-accent);background:#f6f9ff}

#ski-first-look .ski-job-item strong{display:block;font-size:21px;letter-spacing:-.5px;margin-bottom:4px}
#ski-first-look .ski-job-item p{font-size:15px;color:var(--ski-muted)}
#ski-first-look .ski-badge{display:inline-flex;align-items:center;gap:6px;min-height:29px;border-radius:7px;padding:4px 9px;font-size:14px;font-weight:650;white-space:nowrap;background:var(--ski-blue-soft);color:#155fba}
#ski-first-look .ski-badge.return{background:var(--ski-orange-soft);color:var(--ski-orange)}
#ski-first-look .ski-badge.done{background:var(--ski-green-soft);color:var(--ski-green)}
#ski-first-look .ski-badge.neutral{background:#eef1f5;color:var(--ski-muted)}
#ski-first-look .ski-job-time{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
#ski-first-look .ski-visit{background:white;border:1px solid var(--ski-line);border-radius:20px;overflow:clip}

#ski-first-look .ski-priority span{display:flex;align-items:center;gap:9px}
#ski-first-look .ski-priority button{padding:9px 15px;min-height:44px;background:white;border:1px solid #e7c49d;border-radius:10px;color:var(--ski-orange);font-size:16px;font-weight:650;white-space:nowrap}
#ski-first-look .ski-visit-inner{padding:28px}
#ski-first-look .ski-visit-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
#ski-first-look .ski-arrival{font-size:20px;color:var(--ski-muted)}

#ski-first-look .ski-place{font-size:40px;font-weight:750;letter-spacing:-1.6px;line-height:1.2;margin-bottom:12px;overflow-wrap:anywhere}

#ski-first-look .ski-customer span{font-size:17px;color:var(--ski-muted)}

#ski-first-look .ski-next{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border:1px solid var(--ski-line);border-radius:15px;background:white;padding:16px 22px;font-size:17px}

#ski-first-look .ski-overlay{position:absolute;inset:0;z-index:5;background:#18223066;display:flex;align-items:flex-start;justify-content:center;padding:90px 22px 22px;backdrop-filter:blur(3px)}
#ski-first-look .ski-dialog{width:100%;max-width:610px;background:white;border:1px solid var(--ski-line);border-radius:22px;box-shadow:0 20px 60px #15213233;padding:24px;align-self:flex-start;min-width:0}
#ski-first-look .ski-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}

#ski-first-look .ski-dialog-note{font-size:14px;color:var(--ski-muted);margin-top:12px}

#ski-first-look .ski-board-list{display:grid;gap:12px}
#ski-first-look .ski-board-row{padding:15px;border:1px solid var(--ski-line);border-radius:12px}
#ski-first-look .ski-board-row-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
#ski-first-look .ski-board-row p{font-size:16px;color:var(--ski-muted);margin:7px 0 12px}
#ski-first-look .ski-board-row button{min-height:44px;padding:10px 15px;font-size:16px;background:#f2f6fc;border:1px solid var(--ski-line);border-radius:9px;color:var(--ski-ink)}

#ski-first-look .ski-empty{padding:36px 20px;text-align:center;color:var(--ski-muted);font-size:18px;background:white;border:1px solid var(--ski-line);border-radius:15px}

<script>
(function(){
  const root=document.getElementById('ski-first-look');
  const content=root.querySelector('#ski-content');
  const notice=root.querySelector('#ski-notice');

  const dialogBody=root.querySelector('#ski-dialog-content');
  const dialogTitle=root.querySelector('#ski-dialog-title');
  const products=[{id:'ski',name:'스키',price:20000,icon:'snowflake'},{id:'board',name:'보드',price:20000,icon:'rectangle-horizontal'},{id:'clothes',name:'의류',price:10000,icon:'shirt'},{id:'visor',name:'바이저 헬멧',price:10000,icon:'shield-check'},{id:'helmet',name:'헬멧',price:5000,icon:'shield'},{id:'goggles',name:'고글',price:5000,icon:'glasses'},{id:'pads',name:'보호대',price:5000,icon:'shield-plus'}];
  // Sample catalog only. Live availability and date-dependent prices are shop settings.
  const liftCatalog=[['morning','오전권','time',40000,30000],['afternoon','오후권','time',45000,35000],['night','야간권','time',40000,30000],['after-night','후야권','time',65000,50000],['day','종일권','time',70000,55000],['3hour','3시간권','hours',35000,25000],['4hour','4시간권','hours',45000,35000],['6hour','6시간권','hours',55000,45000]].flatMap(([code,name,group,adult,child])=>[{id:code+'-adult',name,group,audience:'성인',price:adult},{id:code+'-child',name,group,audience:'소인',price:child}]);
  const liftFavorites=['afternoon-adult','night-adult','after-night-adult'];
  const jobs=[
    {id:'R-021',type:'return',name:'김영희',phone:'010-0000-0000',time:'16:30',returnPreset:'afternoon',returnLabel:'오후타임 후',place:'만선 티롤 앞',detail:'티롤 호텔 정문 · 버스 정차 구역',items:[['스키',2],['의류',2],['헬멧',1]],status:'waiting',urgent:true,ack:false,sms:false},
    {id:'R-022',type:'delivery',name:'박준호',phone:'010-0000-0000',time:'16:40',place:'설천 주차장',detail:'주차장 입구 · 고객과 통화 후 만남',items:[['보드',2],['의류',2],['헬멧',2]],status:'waiting',urgent:false,ack:false,sms:false},
    {id:'R-023',type:'return',name:'이수진',phone:'010-0000-0000',time:'17:00',place:'만선 광장',detail:'곤돌라 매표소 앞',items:[['스키',1],['보드',1],['의류',2]],status:'waiting',urgent:false,ack:false,sms:false},
    {id:'R-020',type:'direct',name:'정우진',phone:'010-0000-0000',time:'16:50',place:'스키샵 직접 반납',detail:'매장 방문 예정',items:[['스키',1],['고글',1]],status:'waiting',urgent:false,ack:false,sms:false}
  ];
  const rentalStart=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const returnPresets=[{id:'afternoon',label:'오후타임 후',time:'16:30',dayOffset:0},{id:'night',label:'야간타임 후',time:'22:00',dayOffset:0},{id:'next-morning',label:'익일 오전',time:'09:00',dayOffset:1}];
  const state={view:'shop',days:1,startDate:rentalStart,endDate:rentalStart,equipmentDays:[{ski:1,clothes:1}],activeDay:0,productTab:'equipment',qty:{ski:1,clothes:1},returnQty:{ski:1,clothes:1},physicalConfirmed:false,tickets:[],liftDate:rentalStart,liftQuery:'',liftAudience:'성인',liftGroup:'favorites',liftPage:0,discountSteps:[],itemDiscounts:{},customerId:'C-001',name:'김민수',phone:'010-0000-0000',returnMethod:'collect',clothesReturnMethod:'direct',ticketReturnMethod:'direct',clothesReturnDate:'',ticketReturnDate:'',returnPreset:'afternoon',manualReturnDate:rentalStart,manualReturnTime:'16:30',place:'만선 티롤 앞',mode:'simple',jobPage:0,filter:'all',sort:'time',dateOffset:0,selected:'R-021',saved:false};
  const discountPresets=[{id:'D-01',name:'단골',value:5000},{id:'D-02',name:'단골',value:10000}];
  const customers=[{id:'C-001',name:'김민수',phone:'010-0000-0000',note:'단골 · 가족 방문',history:[{id:'H-001',date:'2026-01-15',days:2,items:[['스키',1],['의류',1]],total:54000}]},{id:'C-002',name:'김영희',phone:'010-0000-1021',note:'장비는 매장 수령',history:[{id:'H-002',date:'2026-02-08',days:1,items:[['스키',2],['의류',2],['헬멧',1]],total:65000}]},{id:'C-003',name:'박준호',phone:'010-0000-1022',note:'샘플 제휴업체 방문',history:[{id:'H-003',date:'2026-02-10',days:1,items:[['보드',2],['헬멧',2]],total:45000}]},{id:'C-004',name:'김민수',phone:'010-0000-1024',note:'동명이인 예시',history:[]}];
  const design={radius:12,accent:'오렌지',large:true};
  let modalJob=null;let previousFocus=null;let discountDraft=null;let customerDetailId=null;let customerEditingId=null;let physicalNextAction='';
  const money=n=>Math.round(n).toLocaleString('ko-KR')+'원';
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
  const dayQty=(id,index=state.activeDay)=>state.equipmentDays[index]?.[id]||0;
  const billedQuantity=id=>state.equipmentDays.reduce((sum,day)=>sum+(day[id]||0),0);
  const peakQuantity=id=>state.equipmentDays.reduce((peak,day)=>Math.max(peak,day[id]||0),0);
  const picked=()=>products.filter(p=>billedQuantity(p.id)>0);
  const differentDailyQuantities=()=>picked().some(p=>state.equipmentDays.some(day=>(day[p.id]||0)!==dayQty(p.id,0)));
  const needsPhysicalCheck=()=>differentDailyQuantities()&&!state.physicalConfirmed;
  const hasItems=()=>picked().length>0||state.tickets.length>0;
  const ticketTotal=(lines=state.tickets)=>lines.reduce((sum,line)=>sum+line.price*line.qty,0);
  const ticketCount=(lines=state.tickets)=>lines.reduce((sum,line)=>sum+line.qty,0);
  const lineTotal=p=>p.price*billedQuantity(p.id);
  const discountAmount=(base,value)=>Math.min(base,Math.max(0,Math.floor(Number(value)||0)));
  const itemDiscount=p=>discountAmount(lineTotal(p),(state.itemDiscounts[p.id]||0)*(state.qty[p.id]||0));
  const subtotal=()=>discountBase()+ticketTotal();
  const discountBase=()=>picked().reduce((a,p)=>a+lineTotal(p)-itemDiscount(p),0);
  const requestedDiscount=()=>state.discountSteps.reduce((sum,step)=>sum+step.value,0);
  const discount=()=>discountAmount(discountBase(),requestedDiscount());
  const totalDiscount=()=>picked().reduce((a,p)=>a+itemDiscount(p),0)+discount();
  const typeLabel=j=>j.type==='return'?'수거':j.type==='delivery'?'배달':'매장 직접';
  const statusLabel=j=>j.status==='collected'?'매장 확인 대기':j.status==='returned'?'반납 완료':j.status==='delivered'?'배달 완료':j.status==='moving'?'이동 중':'대기';
  const done=j=>['collected','returned','delivered'].includes(j.status);
  const addDays=(date,days)=>new Date(Date.parse(date+'T00:00:00Z')+days*86400000).toISOString().slice(0,10);
  const dateOffset=date=>Math.round((Date.parse(date+'T00:00:00Z')-Date.parse(rentalStart+'T00:00:00Z'))/86400000);
  const dateLabel=date=>date?(date.slice(0,4)!==rentalStart.slice(0,4)?date.slice(0,4)+'/':'')+Number(date.slice(5,7))+'/'+Number(date.slice(8,10)):'';
  const validDate=date=>/^\d{4}-\d{2}-\d{2}$/.test(date)&&Number.isFinite(Date.parse(date+'T00:00:00Z'))&&addDays(date,0)===date;
  const validTime=time=>/^([01]\d|2[0-3]):[0-5]\d$/.test(time);
  const lastUseDate=()=>state.endDate;
  const equipmentDateAt=index=>validDate(state.startDate)?addDays(state.startDate,index):'';
  const useDates=()=>validDate(state.startDate)?Array.from({length:state.days},(_,i)=>addDays(state.startDate,i)):[];
  function suggestPhysicalQuantities(){state.qty=Object.fromEntries(picked().map(p=>[p.id,peakQuantity(p.id)]));state.returnQty={...state.qty};state.physicalConfirmed=false;}
  function resizeEquipmentDays(){
    const countChanged=state.equipmentDays.length!==state.days;
    state.equipmentDays=Array.from({length:state.days},(_,i)=>({...state.equipmentDays[Math.min(i,state.equipmentDays.length-1)]}));
    state.activeDay=Math.min(state.activeDay,state.days-1);if(countChanged)suggestPhysicalQuantities();
    if(!useDates().includes(state.liftDate)&&!state.tickets.some(t=>t.date===state.liftDate))state.liftDate=state.startDate;
  }
  function dailyEquipmentRows(){return useDates().map((date,i)=>({date,items:products.filter(p=>dayQty(p.id,i)>0).map(p=>[p.name,dayQty(p.id,i)]),amount:products.reduce((sum,p)=>sum+p.price*dayQty(p.id,i),0)}));}
  function periodError(){if(!validDate(state.startDate)||!validDate(state.endDate))return '이용 시작일과 종료일을 입력해 주세요.';if(state.endDate<state.startDate)return '종료일은 시작일과 같거나 늦어야 합니다.';return '';}
  function returnPlan(){
    const preset=returnPresets.find(p=>p.id===state.returnPreset);
    return preset?{preset:preset.id,label:preset.label,date:validDate(lastUseDate())?addDays(lastUseDate(),preset.dayOffset):'',time:preset.time}:{preset:'manual',label:'직접 시간 선택',date:state.manualReturnDate,time:state.manualReturnTime};
  }
  function returnError(plan){
    if(periodError())return periodError();
    if(!validDate(plan.date)||!validTime(plan.time))return '반납 날짜와 시간을 입력해 주세요.';
    if(plan.date<lastUseDate())return '반납일이 마지막 이용일보다 빠릅니다. 이용 기간이나 반납일을 확인해 주세요.';
    return '';
  }
  const scheduleText=plan=>dateLabel(plan.date)+' · '+(plan.preset==='manual'?plan.time:plan.label+' · 기준 '+plan.time);
  const jobDate=j=>j.returnDate||addDays(rentalStart,j.dateOffset||0);
  const hasPreset=j=>j.returnPreset&&j.returnPreset!=='manual';
  const jobSchedule=j=>dateLabel(jobDate(j))+' · '+(hasPreset(j)?j.returnLabel+' · 기준 ':'')+j.time;
  const jobOffsets=()=>Array.from(new Set([0,1,2,3,Number(state.dateOffset),...jobs.map(j=>j.dateOffset||0)])).sort((a,b)=>a-b);
  function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:22,height:22}});}
  function tell(text){notice.textContent=text;notice.hidden=false;}
  function clearNotice(){notice.hidden=true;}
  function physicalItems(){return picked().map(p=>p.name+' '+state.qty[p.id]+'개').join(' · ');}
  function equipmentQuantityText(p){const counts=state.equipmentDays.map(day=>day[p.id]||0);return counts.every(q=>q===counts[0])?counts[0]+'개 × '+state.days+'일':counts.map((q,i)=>dateLabel(equipmentDateAt(i))+' '+q+'개').join(' · ');}
  function receipt(editable=true){return picked().map(p=>{const same=state.equipmentDays.every(day=>(day[p.id]||0)===dayQty(p.id,0));return '<div class="ski-receipt-row"><span>'+p.name+(same?' <b>'+dayQty(p.id,0)+'개</b>':'')+'</span><strong>'+money(lineTotal(p)-itemDiscount(p))+'</strong><small>'+(same?money(p.price)+' × '+equipmentQuantityText(p):equipmentQuantityText(p)+'<br>'+money(p.price)+' / 1일 · 날짜별 요금 합산')+(itemDiscount(p)>0?' · 장비당 할인 −'+money(itemDiscount(p)):'')+'</small>'+(editable&&state.view==='shop'?'<button type="button" class="ski-item-discount" data-discount-item="'+p.id+'">'+(p.name+(itemDiscount(p)>0?' 장비당 할인 변경':' 장비당 할인'))+'</button>':'')+'</div>';}).join('')||(!state.tickets.length?'<p class="ski-secondary">장비 또는 리프트권을 선택해 주세요.</p>':'');}
  function ticketReceipt(editable){return state.tickets.length?'<section class="ski-ticket-receipt" aria-label="선택한 리프트권"><div class="ski-lift-heading"><h3>리프트권</h3><span class="ski-secondary">'+ticketCount()+'매</span></div>'+state.tickets.map((t,index)=>'<'+(editable?'button type="button" data-ticket-edit="'+index+'"':'div')+' class="ski-ticket-row"><span>'+escape(t.name)+' · '+escape(t.audience)+' <b>'+t.qty+'매</b></span><strong>'+money(t.price*t.qty)+'</strong><small>'+dateLabel(t.date)+' 사용 · '+money(t.price)+'/매'+(editable?' · 수량 변경 ›':'')+'</small></'+(editable?'button':'div')+'>').join('')+'</section>':'';}
  function plannedReturnItems(){return picked().filter(p=>state.returnQty[p.id]>0).map(p=>[p.name,state.returnQty[p.id]]);}
  function physicalSummary(editable){const same=picked().every(p=>state.qty[p.id]===state.returnQty[p.id]);return !picked().length?'':'<div class="ski-physical-summary"><div class="ski-physical-summary-head"><strong>'+(needsPhysicalCheck()?'실제 수량 확인 필요':'실제 장비')+'</strong>'+(editable?'<button type="button" class="ski-setting-button" data-action="physical">수량 확인 '+icon('chevron-right')+'</button>':'')+'</div><p>'+(same?'지급·수거':'지급')+' · '+physicalItems()+'</p>'+(!same?'<p>마지막 수거 · '+(plannedReturnItems().map(i=>i[0]+' '+i[1]+'개').join(' · ')||'없음')+'</p>':'')+(needsPhysicalCheck()?'<small>일별 최대 수량을 제안했습니다. 실제 수량을 확인해 주세요.</small>':'')+'</div>';}
  function quoteSummary(editable=true){return '<div class="ski-receipt">'+receipt(editable)+'</div>'+physicalSummary(editable)+ticketReceipt(editable);}
  function changeTickets(lines,id,date,delta){
    const ticket=liftCatalog.find(t=>t.id===id);if(!ticket||!validDate(date))return;
    const index=lines.findIndex(t=>t.id===id&&t.date===date);const current=index>=0?lines[index]:{...ticket,date,qty:0};const qty=Math.max(0,Math.min(99,current.qty+delta));
    if(!qty){if(index>=0)lines.splice(index,1);}else if(index>=0)current.qty=qty;else lines.push({...current,qty});
  }
  function daySelector(kind){
    const dates=kind==='equipment'?useDates():Array.from(new Set([...useDates(),...state.tickets.map(t=>t.date),...(validDate(state.liftDate)?[state.liftDate]:[])])).sort();
    const active=kind==='equipment'?equipmentDateAt(state.activeDay):state.liftDate;
    const label=date=>{const index=useDates().indexOf(date);const count=kind==='equipment'?products.reduce((sum,p)=>sum+dayQty(p.id,index),0):ticketCount(state.tickets.filter(t=>t.date===date));return {title:index>=0?(index+1)+'일차':'별도 날짜',date:dateLabel(date),count:count+(kind==='equipment'?'개':'매')};};
    if(periodError())return '<p class="ski-return-error">이용 기간을 먼저 확인해 주세요.</p>';

    if(b.dataset.vehicleJob){state.selected=b.dataset.vehicleJob;state.dateOffset=jobs.find(j=>j.id===b.dataset.vehicleJob).dateOffset||0;state.filter='all';state.view='vehicle';closeDialog();render();return;}
    if(b.dataset.alert){const j=jobs.find(x=>x.id===b.dataset.alert);j.urgent=true;j.ack=false;board();return;}
    if(b.dataset.final){const j=jobs.find(x=>x.id===b.dataset.final);modalJob=j;openDialog('매장 최종 확인','<p class="ski-secondary">'+escape(j.name)+' · '+escape(j.place)+'</p><div class="ski-equipment">'+j.items.map(i=>'<span>'+escape(i[0])+' <strong>'+i[1]+'</strong></span>').join('')+'</div><p>수량과 장비 상태를 모두 확인했나요?</p><button type="button" class="ski-primary" data-action="final-confirm">모두 확인 · 반납 완료</button>');return;}
    const a=b.dataset.action;const j=selectedJob();
    if(a==='representative'){representative();return;}
    if(a==='representative-done'){closeDialog();return;}
    if(a==='close-dialog'){closeDialog();return;}
    if(a==='board'||a==='show-saved'){board();return;}
    if(a==='save'){save();return;}
    if(a==='physical'){openPhysical();return;}
    if(a==='toggle-period'){state.periodExpanded=!state.periodExpanded;render();return;}
    if(a==='physical-apply'){
      const issued={},returns={};let error='';
      for(const p of picked()){const issuedInput=root.querySelector('[data-issued="'+p.id+'"]');const returnInput=root.querySelector('[data-return-count="'+p.id+'"]');issued[p.id]=Number(issuedInput.value);returns[p.id]=Number(returnInput.value);if(!issuedInput.value.trim()||!Number.isInteger(issued[p.id])||issued[p.id]<peakQuantity(p.id)||issued[p.id]>billedQuantity(p.id))error=p.name+' 지급 수량은 '+peakQuantity(p.id)+'~'+billedQuantity(p.id)+'개의 정수로 입력해 주세요.';if(!returnInput.value.trim()||!Number.isInteger(returns[p.id])||returns[p.id]<0||returns[p.id]>issued[p.id])error=p.name+' 마지막 수거 수량은 0~'+issued[p.id]+'개의 정수로 입력해 주세요.';}
      if(error){const message=root.querySelector('#ski-physical-error');message.hidden=false;message.textContent=error;return;}
      const next=physicalNextAction;state.qty=issued;state.returnQty=returns;state.physicalConfirmed=true;state.saved=false;closeDialog();render();if(next==='save')save();return;
    }
    if(a==='undo-discount'||a==='clear-discount'){if(a==='undo-discount')state.discountSteps.pop();else state.discountSteps=[];state.saved=false;render();return;}
    if(a==='discount-apply'||a==='discount-clear'){applyDiscount(a==='discount-clear');return;}
    if(a==='customers'){customerSearch();return;}
    if(a==='customer-new'){customerForm(null);return;}
    if(a==='customer-edit'){customerForm(customerDetailId);return;}
    if(a==='customer-use'){const c=customers.find(c=>c.id===customerDetailId);state.customerId=c.id;state.name=c.name;state.phone=c.phone;state.saved=false;closeDialog();render();tell('대표자 '+c.name+' 고객을 선택했습니다. 할인은 간편 할인에서 적용할 수 있습니다.');return;}
    if(a==='customer-save'){const name=root.querySelector('[data-customer-edit="name"]').value.trim();const phone=root.querySelector('[data-customer-edit="phone"]').value.trim();const note=root.querySelector('[data-customer-edit="note"]').value.trim();if(!name||phone.replace(/\D/g,'').length<8){const error=root.querySelector('#ski-customer-error');error.hidden=false;error.textContent='대표자 이름과 연락 가능한 전화번호를 입력해 주세요.';return;}let c=customers.find(c=>c.id===customerEditingId);if(c){c.name=name;c.phone=phone;c.note=note;}else{c={id:'C-'+(customers.length+1),name,phone,note,history:[]};customers.push(c);}if(state.customerId===c.id){state.name=name;state.phone=phone;state.saved=false;render();}customerDetail(c.id);return;}
    if(a==='time-settings'){openDialog('매장 반납 타임 기준','<p class="ski-secondary">시안용 예시 시간입니다. 실제 매장 운영에 맞춰 설정합니다.</p><div class="ski-fields">'+returnPresets.map(p=>'<label class="ski-field">'+p.label+'<input type="time" data-setting="'+p.id+'" value="'+p.time+'"></label>').join('')+'</div><p class="ski-dialog-note">익일 오전은 마지막 이용일의 다음 날입니다. 기존 접수 건의 시간은 유지됩니다.</p><p id="ski-settings-error" class="ski-return-error" role="alert" hidden></p><button type="button" class="ski-primary" data-action="save-time-settings">기준 시간 저장</button>');return;}
    if(a==='save-time-settings'){const values=returnPresets.map(p=>root.querySelector('[data-setting="'+p.id+'"]').value);if(values.some(t=>!validTime(t))){const error=root.querySelector('#ski-settings-error');error.hidden=false;error.textContent='세 타임의 기준 시간을 모두 입력해 주세요.';return;}const activeChanged=returnPresets.some((p,i)=>p.id===state.returnPreset&&p.time!==values[i]);returnPresets.forEach((p,i)=>p.time=values[i]);if(activeChanged)state.saved=false;closeDialog();render();tell('기준 시간을 바꿨습니다. 기존 접수는 유지되며, 작성 중인 건은 접수 저장 시 적용됩니다.');return;}
    if(a==='quote'){const plan=returnPlan();const equipment=picked().length>0;const error=equipment?returnError(plan):'';if(error){tell(error);return;}openDialog('대여 견적','<p class="ski-secondary">우리 스키샵 · '+escape(state.name)+' · '+(equipment?state.days+'일 대여':'리프트권 구매')+'</p>'+(equipment?'<p class="ski-quote-schedule">이용일 '+dateLabel(state.startDate)+' ~ '+dateLabel(lastUseDate())+'<br>반납 '+scheduleText(plan)+'<br>'+(state.returnMethod==='collect'?'차량 수거 · '+escape(state.place):'매장 직접 반납')+'</p>':'')+quoteSummary(false)+'<div class="ski-discount" style="margin-top:22px"><span>총 금액 할인</span><strong>−'+money(discount())+'</strong></div><div class="ski-total"><span>최종 금액</span><strong>'+money(subtotal()-discount())+'</strong></div><button type="button" class="ski-primary" data-action="close-dialog">확인</button>');return;}
    if(a==='ack'){j.ack=true;window.SkiOps?.returnUI?.ackJob(j.id);render();tell('이 브라우저에서 확인 요청을 읽음으로 표시했습니다.');return;}
    if(a==='partial-return'&&window.SkiOps?.returnUI){window.SkiOps.returnUI.collect(j,true);return;}
    if(a==='complete'&&j?.type==='return'&&window.SkiOps?.returnUI){window.SkiOps.returnUI.collect(j,false);return;}
    if(a==='partial-return'){partialMissing={};openPartial(j);return;}
    if(a==='partial-preview'){openDialog('일부 반납 확인','<p>'+escape(j.name)+' 고객님</p><div class="so-return-totals"><span>받은 물품 '+j.items.reduce((n,i,index)=>n+i[1]-(partialMissing[index]||0),0)+'개</span><span>고객에게 남음 '+Object.values(partialMissing).reduce((a,b)=>a+b,0)+'개</span></div><p class="ski-dialog-note">수거한 수량은 매장 최종 확인 전까지 차량 보관으로 표시합니다.</p><button class="ski-primary" type="button" data-action="close-dialog">확인</button>');return;}
    if(a==='phone'){openDialog('고객 연락처','<p>'+escape(j.name)+' 고객님</p><div class="ski-phone-number">'+escape(j.phone)+'</div><p class="ski-dialog-note">전화 연결 버튼의 시안입니다. 실제 통화는 시작되지 않습니다.</p><button type="button" class="ski-primary" data-action="close-dialog">확인</button>');return;}
    if(a==='sms'){modalJob=j;openDialog('출발 문자 확인','<p class="ski-secondary">'+escape(j.name)+' · '+escape(j.phone)+'</p><div class="ski-message-preview">[우리 스키샵] 차량이 출발하였습니다. 5분 내로 도착하니 '+(j.type==='return'?'반납':'배달')+' 장소에서 '+(j.type==='return'?'장비와 함께 ':'')+'대기해 주시기 바랍니다.</div><button type="button" class="ski-primary" data-action="send-sms" '+(j.sms?'disabled':'')+'>'+icon('send')+(j.sms?'출발 안내 완료':'출발 안내 보내기')+'</button><p class="ski-dialog-note">샘플 시안이며 실제 문자는 발송되지 않습니다.</p>');return;}
    if(a==='send-sms'){if(modalJob){modalJob.sms=true;modalJob.status='moving';}closeDialog();render();tell('출발 안내 완료 상태로 변경했습니다. 실제 문자는 발송되지 않았습니다.');return;}
    if(a==='complete'){modalJob=j;openDialog(j.type==='return'?'수거 수량 확인':'배달 수량 확인','<p>'+escape(j.name)+' · '+escape(j.place)+'</p><div class="ski-equipment">'+j.items.map(i=>'<span>'+escape(i[0])+' <strong>'+i[1]+'</strong></span>').join('')+'</div><p>'+(j.type==='return'?'위 장비를 모두 받으셨나요?':'위 장비를 모두 전달하셨나요?')+'</p><button type="button" class="ski-primary" data-action="complete-confirm">모두 '+(j.type==='return'?'수거':'배달')+' 완료</button><p class="ski-dialog-note">'+(j.type==='return'?'수거 후 매장에서 최종 확인해야 반납 완료로 바뀝니다.':'고객에게 전달한 장비 수량을 확인해 주세요.')+'</p>');return;}
    if(a==='complete-confirm'){if(modalJob){modalJob.status=modalJob.type==='return'?'collected':'delivered';modalJob.ack=true;}closeDialog();render();tell('처리 상태가 매장 화면에도 반영됐습니다.');return;}
    if(a==='final-confirm'){if(modalJob)modalJob.status='returned';closeDialog();render();tell('매장 최종 확인이 끝나 반납 완료로 변경됐습니다.');return;}
  });
  root.addEventListener('keydown',e=>{if(overlay.hidden){if(e.target.hasAttribute('data-product-tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();state.productTab=e.key==='Home'?'equipment':e.key==='End'?'lift':state.productTab==='equipment'?'lift':'equipment';render();root.querySelector('[data-product-tab="'+state.productTab+'"]').focus();}return;}if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const f=Array.from(overlay.querySelectorAll('button:not(:disabled),input,select'));if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  root.addEventListener('ski:intake-action',e=>{if(e.detail==='representative')representative();if(e.detail==='customers')customerSearch();});
  window.SkiIntake={
    draft(){
      if(state.saved)return null;
      if(needsPhysicalCheck()){openPhysical('save');return null;}
      const plan=returnPlan(),error=periodError()||returnError(plan);
      if(error)return {error};
      if(!state.name.trim()||state.phone.replace(/\D/g,'').length<8)return {error:'대표자 이름과 연락 가능한 전화번호를 입력해 주세요.'};
      if(!hasItems())return {error:'장비 또는 리프트권을 선택해 주세요.'};
      const itemPlan=key=>({method:state[key+'ReturnMethod']==='collect'?'vehicle':'direct',date:state[key+'ReturnDate']||plan.date,time:plan.time,slot:plan.label,place:state[key+'ReturnMethod']==='collect'?state.place:'매장'});
      const equipmentPlan={method:state.returnMethod==='collect'?'vehicle':'direct',date:plan.date,time:plan.time,slot:plan.label,place:state.returnMethod==='collect'?state.place:'매장'};
      const gear=picked().map(p=>({id:p.id,label:p.name,category:p.id==='clothes'?'clothing':'equipment',plannedQuantity:state.qty[p.id],returnPlan:p.id==='clothes'?itemPlan('clothes'):equipmentPlan,usage:useDates().map((date,index)=>({date,quantity:dayQty(p.id,index)}))}));
      const tickets=state.tickets.map((t,index)=>({id:'ticket-'+index,label:t.name+' '+t.audience,category:'liftTicket',unit:'매',plannedQuantity:t.qty,usage:[{date:t.date,quantity:t.qty}],returnPlan:itemPlan('ticket')}));
      if([...gear,...tickets].some(i=>!validDate(i.returnPlan.date)||i.returnPlan.date<state.startDate))return {error:'품목별 반납일은 이용 시작일 이후로 입력해 주세요.'};
      const amount=subtotal()-discount();
      return {payload:{customer:{id:state.customerId||'C-INTAKE',name:state.name.trim(),phone:state.phone},rental:{startDate:state.startDate,endDate:state.endDate,amountWon:amount},vehicleId:'demo-van-1',returnPlan:equipmentPlan,items:[...gear,...tickets]},earlyReturn:picked().some(p=>state.qty[p.id]!==state.returnQty[p.id]),base:{name:state.name.trim(),phone:state.phone,start:state.startDate,end:state.endDate,pickup:state.startDate,pickupTime:'09:00',due:plan.date,slot:plan.label,time:plan.time,method:state.returnMethod==='collect'?'차량 수거':'매장 직접',place:equipmentPlan.place,amount,paid:0,issued:0,returned:0,collected:0,gear:gear.map(i=>i.label+' '+i.plannedQuantity).join(' · ')||'장비 없음',detail:state.days+'일 이용',tickets:state.tickets.map(t=>t.name+' '+t.qty+'매').join(' · ')||'없음',ticketItems:state.tickets.map((t,index)=>({id:'ticket-'+index,label:t.name+' '+t.audience,quantity:t.qty,date:t.date,issued:0})),items:gear.map(i=>[i.label,i.plannedQuantity,0]),customer:state.customerId||'C-INTAKE',note:'실제 지급 수량과 반납 일정을 확인해 주세요.'}};
    },
    saved(id){state.saved=true;state.savedOrderId=id;render();}
  };
  function applyDesign(){root.style.setProperty('--ski-shop-radius',design.radius+'px');root.style.setProperty('--ski-shop-accent',design.accent==='블루'?'#0665ef':'#c54b15');root.style.setProperty('--ski-base',design.large?'20px':'18px');}
  render();applyDesign();
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'accent',{label:'매장 버튼 색상',options:['블루','오렌지']});tweak.addSlider(design,'radius',{label:'매장 카드 둥글기',min:8,max:24,step:2,unit:'px'});}
})();
</script>
